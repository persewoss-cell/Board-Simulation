<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학교 복도 환경 시뮬레이션</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>학교 복도 환경 시뮬레이션</h1>
    <p class="subtitle">복도 환경판 크기를 입력하고, 원하는 크기의 작품을 배치해보세요.</p>
  </header>

  <section class="panel">
    <h2><span class="heading-icon" aria-hidden="true">⚙️</span> 환경판 설정</h2>
    <div class="input-row">
      <label>환경판 이름
        <input type="text" id="boardNameInput" placeholder="예: 본관 3층 복도" maxlength="30">
      </label>
      <label>가로
        <input type="number" id="boardWidthInput" min="1" step="0.1" placeholder="cm">
        <span class="unit">cm</span>
      </label>
      <label>세로
        <input type="number" id="boardHeightInput" min="1" step="0.1" placeholder="cm">
        <span class="unit">cm</span>
      </label>
      <button id="applyBoardBtn" type="button">환경판 생성</button>
      <button id="saveBoardBtn" type="button" class="secondary-btn">환경판 저장</button>
      <button id="deleteBoardBtn" type="button" class="danger-btn">환경판 삭제</button>
    </div>
    <p class="hint" id="boardHint">환경판 이름과 가로/세로 크기(cm)를 입력하고 &lsquo;환경판 생성&rsquo;을 눌러주세요.</p>
    <div class="saved-boards" id="savedBoardsList"></div>
  </section>

  <section class="panel board-panel">
    <h2 id="boardTitle"><span class="heading-icon" aria-hidden="true">🖼️</span> 환경판</h2>
    <div class="board-wrapper" id="boardWrapper">
      <div class="board board-empty" id="board">
        <p class="board-placeholder" id="boardPlaceholder">환경판이 아직 생성되지 않았습니다.</p>
      </div>
    </div>
    <div class="board-toolbar">
      <span class="board-info" id="boardInfo"></span>
      <div class="board-toolbar-buttons">
        <button id="clearBoardBtn" type="button" disabled>배치된 작품 모두 지우기</button>
        <button id="saveImageBtn" type="button" disabled>이미지로 저장</button>
      </div>
    </div>
  </section>

  <section class="panel disabled-panel" id="presetPanel">
    <h2><span class="heading-icon" aria-hidden="true">🎨</span> 액자 사이즈 갤러리</h2>
    <div class="gallery" id="presetGallery"></div>
  </section>

  <section class="panel disabled-panel" id="customPanel">
    <h2><span class="heading-icon" aria-hidden="true">✏️</span> 환경작품 생성하기</h2>
    <div class="input-row">
      <label>가로
        <input type="number" id="customWidthInput" min="1" step="0.1" placeholder="cm" disabled>
        <span class="unit">cm</span>
      </label>
      <label>세로
        <input type="number" id="customHeightInput" min="1" step="0.1" placeholder="cm" disabled>
        <span class="unit">cm</span>
      </label>
      <button id="addCustomBtn" type="button" disabled>생성</button>
    </div>
    <div class="gallery" id="customGallery"></div>
  </section>
</div>

<div class="drag-ghost" id="dragGhost" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="script.js"></script>
</body>
</html>
